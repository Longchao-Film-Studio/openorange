# ruff 配置。
#
# 设计原则：**默认全开，豁免有据**。
#   select = ["ALL"] —— 新代码默认受 ruff 全部 1066 条规则约束；
#   不适用的规则按族写进 ignore，每条都注明「为什么不做」。
#   这样豁免是一个**显式决策**，而不是靠少选规则来回避问题。
#
# 演进记录（2026-10-25 一天内完成，逐批提交，每批都跑全量 65 套件）：
#   批A-G  UP031 % 格式化 995 -> 0（自写 tools/fix_up031.py 做 ast 精确区间替换）
#   D1     UP032 .format -> f-string 853 处
#   D3     未用参数/变量 146 处归零
#   D4     BLE001 静默吞异常清零 68 处（收窄 27 + contextlib.suppress 22 + tests/tools 19）
#   D5     SLF001 私有成员 196 -> 27（重命名 15 个包内公共 API，剩测试豁免）
#   D6     4 个上帝函数拆分（C901 39/37/23/18 -> 0）+ 复杂度阈值定档
#   收尾   全规则扫描 19,959 处 / 104 条规则，逐族核实后写入下方 ignore
#
# 全量基线：suites=65 items=1945 bad=[]；ruff check . -> All checks passed
#
# 工具链钉版本：requirements-dev.txt（ruff==0.17.2 —— 本配置在该版本实测全绿）。
#   复核：py -m pip install -r requirements-dev.txt && py -m ruff check .
#   注意 select = ["ALL"] 的规则全集随版本变化，升级 ruff 必须重跑并复核豁免清单。

target-version = "py312"
line-length = 100

# UP031（% 格式化）已于 2026-10-25 全仓清零，是硬规范：新代码用 f-string。
#   logging 仍建议惰性传参（_log.info("...%s", x)）——那是 logging 的语义。
[lint]
# ★ 2026-10-25 起 select = ["ALL"]：默认**全规则开启**，
#   不适用的规则逐族写进下面的 ignore 并注明理由——
#   这样「为什么不做」也有据可查，而不是靠少选几条规则回避问题。
#   新增代码默认受全部规则约束，只有这里列出的族被豁免。
select = ["ALL"]

# ══════════════════════════════════════════════════════════════════════════
# 豁免清单（2026-10-25 全仓实测 19,959 处 / 104 条规则，逐族核实后归类）
# ══════════════════════════════════════════════════════════════════════════
ignore = [
  # ---- A. 中文项目必然：9,591 处 ----
  # 全角标点（。，、：；！？（）「」）被 ruff 判为「歧义 unicode」。
  # 本项目注释/文案/日志全中文，这条规则等于要求把中文标点改成 ASCII，不适用。
  "RUF001", "RUF002", "RUF003",

  # ---- B. 类型注解：3,255 处 ----
  # 项目从未采用类型注解风格（未引入 mypy / pyright）。
  # 全量补注解是数万行的纯翻新，收益与风险不成比例。
  "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN206",

  # ---- C. docstring 规范：2,115 处 ----
  # 不强制 pydocstyle 的「首行句号 / 空行 / 公共函数必须有 docstring」。
  # 本项目的文档义务落在**注释说明为什么**（见 R6），不落在 docstring 格式。
  # D203/D211、D212/D213 本身互斥，一并列出避免警告。
  "D100", "D101", "D102", "D103", "D105", "D107", "D205", "D301",
  "D400", "D402", "D403", "D415", "D203", "D211", "D212", "D213",

  # ---- D. 命名与排版：801 处 ----
  # E501 行超长：line-length=100 已放宽，剩余是中文注释与表格对齐，不折行更好读。
  # E701/E702 一行多语句：项目里用于 `if x: return` 这类紧凑守卫，是刻意写法。
  # E741 歧义变量名（l/I/O）：多为循环里的 `l`，改成别的反而丢语义。
  # Q000 引号：不强制双引号（f-string 转换后单引号更短）。
  "E501", "E701", "E702", "E741",
  "N802", "N803", "N806", "N812",
  "Q000", "COM819", "ISC003", "EXE004", "A002",

  # ---- E. 异常消息风格：165 处 ----
  # TRY003/EM101/EM102：不要求「异常消息必须是变量」或「不能 f-string」。
  # 本项目异常消息带上下文（哪个 uid、哪张表），写死在 raise 处最直观。
  "TRY003", "TRY300", "TRY301", "EM101", "EM102", "EM103",

  # ---- F. 简化建议：62 处 ----
  # SIM/RET/PERF/FURB 等「可以更短」的建议：存量代码已稳定，
  # 逐个改写只降低可读性收益为零；新代码按需参考，不强制。
  "SIM101", "SIM105", "SIM108", "SIM110", "SIM113", "SIM114", "SIM905",
  "RET503", "RET504", "PLR5501", "PLR1711", "PLC0414",
  "FURB122", "FURB136", "FURB171", "FURB192",
  "RUF005", "RUF015", "PERF401", "UP012", "B905", "ICN001",

  # ---- G. 项目架构决定：2,280 处 ----
  # T201 print：本项目用 shared/log_tee 拦截 stdout 落盘（见 log_tee 头部说明），
  #   print 就是统一的日志出口，不是调试残留。
  # E402/PLC0415 import 位置：延迟导入用于**打断循环依赖**（story/property/transport
  #   互相引用），必须在函数内导入，这是设计而非疏忽。
  # PLW0603 global：模块级单例状态（在线表/存档锁）是刻意设计，见 R8 状态写入口收敛。
  # RUF100 失效 noqa：聚合层（ms/__init__.py、dispatch.py）靠 `# noqa: F401` 压制
  #   re-export 的故意导入；ruff 不认这个惯例，清理会删掉 209 个合法导入（实测回滚过）。
  # FBT002/003 布尔位置参数：`f(x, True)` 在协议处理里比关键字更贴近 wire 语义。
  # TID252 相对导入：包内一律相对导入，是项目统一风格。
  # CPY001 版权头：内部项目无版权头要求。
  "T201", "E402", "PLC0415", "PLW0603", "INP001", "RUF100",
  "FBT002", "FBT003", "PLW1510", "PLW2901", "TID252", "CPY001", "PGH003",

  # ---- H. pathlib 迁移：744 处 ----
  # 项目统一用 os.path / open()。迁移到 pathlib 是纯翻新，且会动到大量
  # 已经稳定运行的存档/日志路径拼接代码，风险大于收益。
  "PTH100", "PTH101", "PTH103", "PTH105", "PTH107", "PTH110", "PTH112",
  "PTH113", "PTH118", "PTH119", "PTH120", "PTH122", "PTH123", "PTH202",
  "PTH204", "PTH207", "PTH208",

  # ---- I. 安全类：35 处（逐处核实，全是误报或有意为之）----
  # S101 assert：只在 tests/tools 与启动自检里。
  # S104 绑 0.0.0.0：局域网游戏服本来就该监听所有网卡。
  # S105 硬编码口令：测试口令，以及 `token == "@"` 这类误判。
  # S310 urlopen：全是 127.0.0.1 的本地管理接口。
  # S311 random：游戏逻辑随机（掉落/抖动），非加密用途。
  # S603/S607 subprocess：start_server 启动自家服务，输入受控。
  "S101", "S104", "S105", "S310", "S311", "S603", "S607",

  # ---- J. 魔法数字：630 处 ----
  # PLR2004 要求把 2/3/100 之类提取成常量。本项目大量数字直接对应
  # BDD 表字段（协议错误码 7009/15002/15005、任务类型 1..9），
  # 提常量反而让「这个数字来自哪张表」更难追。
  "PLR2004",

  # ---- K. 已单独处置过、保留豁免 ----
  "BLE001",  # 裸 except：边界兜底。2026-10-25 已把「静默吞异常」清零（291 -> 223），
             #   剩 223 处都带日志或返回默认值；27 处纯转换已收窄为数据类异常，
             #   22 处清理操作改成 contextlib.suppress。详见 git log style(ruff) D4。
  "S110",    # try-except-pass：同上
  "S112",    # try-except-continue：同上
  "SIM115",  # open 不用 with：涉及文件生命周期语义，逐处判断
  "ERA001",  # 注释掉的代码：本项目注释里**大量引用 Lua 源码作为逆向依据**
             #   （如 "#   self:serverMsg(...)"）以及记录历史教训，不是死 Python 代码。
             #   32 处逐一核实过，无一可删（2026-10-25）。
]

# 复杂度阈值（2026-10-25 定档）：ruff 默认（C901=10 / 语句 50 / 分支 12 / 参数 5 /
# return 6）对「数据驱动的游戏服务端」过严——大量分支来自 BDD 表结构而非设计纠缠。
# 取值依据：调到此档后全仓只剩 5 个函数超标，且每个都能说清为什么该保留（见源码 noqa）。
[lint.mccabe]
max-complexity = 20

[lint.pylint]
max-statements = 100
max-branches = 25
max-args = 8
max-positional-args = 8
max-returns = 10

[lint.per-file-ignores]
# 测试的 run() 是线性检查清单（一行一个 check），长但不复杂；
# 工具是一次性脚本。两者的「复杂度」不代表设计问题，故成组豁免。
"tests/*" = ["SIM118", "SLF001", "S101", "S105", "S310", "S603", "S607", "S104",
              "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917"]
"tools/*" = ["SLF001", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917"]
# 测试里故意保留的姿势与游戏存档往返相关，不强行规范
