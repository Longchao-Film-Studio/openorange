# ruff 配置（2026-10-25 首次引入）。
#
# 原则：
#   1. 正确性规则（F/E9）全开 —— 这是"错误"，不是风格；
#   2. 仓库现行惯例显式豁免（裸 except 兜底、utf8 声明——% 格式化 UP031 已于
#      2026-10-25 起改为规范并分批清理，见 git log style(ruff) 批A-F）；
#      这些是 2241 个存量里的 1500+，属于风格翻新，不该混进功能提交；
#   3. 自动清理类（未用导入/未用变量/空 print/排序）保留并逐批清零。
#   4. RUF100（失效 noqa）**不启用**：仓库的 re-export 聚合层（ms/__init__.py、
#      dispatch.py）靠 `# noqa: F401` 压制故意导入，ruff 判它们"失效"是因为
#      它不识别 re-export 惯例——清理会连带删掉 209 个合法导入（2026-10-25 实测已回滚）。
#
# 每清完一批，把对应规则从这里挪进 ignore 之前先和仓库惯例核对一遍。

target-version = "py312"
line-length = 100

# % 格式化（UP031）：2026-10-25 全仓清零（995 -> 0），现在是一条硬规范。
#   - 分批：批A-E 自动 887 处；批F/G 用 tools/fix_up031.py（ast 精确区间替换）
#     再清 434 处；最后 5 处（元组解包 / * 宽度 / 生成器内元组变量）手工改。
#   - 新代码请用 f-string；跨行格式化用 .format 或先拼再插值。
#   - logging 仍建议惰性传参（_log.info("...%s", x)）——那是 logging 的语义，
#     不是 % 格式化；本项目 logging 调用已全部改为 .format 前先求值，保持一致。

[lint]
select = ["F", "E9", "UP009", "I001", "FURB105", "UP004", "FURB167",
          "RUF023", "SIM102", "SIM118", "PERF102", "C4", "UP020", "UP031", "UP032",
          "ARG001", "ARG005", "B007", "RUF059"]
ignore = [
  "BLE001",  # 裸 except：服务端在 RPC / 数据边界必须有兜底——一个坏请求不能拖垮进程。
             #   2026-10-25 已把「静默吞异常」清零（291 -> 223）：
             #     · 生产代码 49 处：27 处纯 int/float 转换收窄为数据类异常
             #       (ValueError, TypeError, KeyError, IndexError, AttributeError)；
             #       22 处清理操作(close/flush/shutdown) 改为 contextlib.suppress(Exception)
             #     · tests/tools 19 处同类处理
             #   剩余 223 处都带日志或返回默认值，属于有意的边界兜底，保留宽捕获。
  "S110",    # try-except-pass：同上
  "S112",    # try-except-continue：同上
  "SIM115",  # open 不用 with：涉及生命周期语义，逐处判断
  "ERA001",  # 注释掉的代码：本项目注释里**大量引用 Lua 源码作为逆向依据**
             #   （如 "#   self:serverMsg(...)"）以及记录历史教训，不是死 Python 代码。
             #   32 处逐一核实过，无一可删（2026-10-25）。
]

[lint.per-file-ignores]
# 测试里故意保留的姿势与游戏存档往返相关，不强行规范
"tests/*" = ["SIM118"]
