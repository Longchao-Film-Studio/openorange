# ruff 配置（2026-10-25 首次引入）。
#
# 原则：
#   1. 正确性规则（F/E9）全开 —— 这是"错误"，不是风格；
#   2. 仓库现行惯例显式豁免（% 格式化、裸 except 兜底、utf8 声明），
#      这些是 2241 个存量里的 1500+，属于风格翻新，不该混进功能提交；
#   3. 自动清理类（noqa 失效/未用导入/未用变量/空 print/排序）保留并逐批清零。
#
# 每清完一批，把对应规则从这里挪进 ignore 之前先和仓库惯例核对一遍。

target-version = "py312"
line-length = 100

[lint]
select = ["F", "E9", "UP009", "RUF100", "I001", "FURB105", "UP004", "FURB167",
          "RUF023", "SIM102", "SIM118", "PERF102", "C4", "UP020"]
ignore = [
  "UP031",   # % 格式化是仓库现行惯例（995 处），风格翻新单独决策
  "BLE001",  # 裸 except 大量是故意的兜底（291 处），收窄需逐处判断
  "S110",    # try-except-pass：同上
  "S112",    # try-except-continue：同上
  "SIM115",  # open 不用 with：涉及生命周期语义，逐处判断
  "RUF059",  # 解包未用变量：常用于"只想要前几个"的场景
]

[lint.per-file-ignores]
# 测试里故意保留的姿势与游戏存档往返相关，不强行规范
"tests/*" = ["SIM118"]
