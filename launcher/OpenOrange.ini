; ============================================================
;  OpenOrange 归龙潮私服启动器 配置文件
;  本文件为外部配置，修改后重启启动器即可生效，无需重新编译
; ============================================================

[Server]
; 登录服务器地址（我们自己的 OpenOrange 后端）
; 说明：这是"取账号身份"的地址，不是官方的 fp-passport
login_url        = http://127.0.0.1:8399/api/launcher/login
; 服务器列表地址（游戏内点"服务器列表"时用）
serverlist_url   = http://127.0.0.1:8080/client/serverlist/v1
; 游戏服地址（客户端最终要连的网关）
game_host        = 127.0.0.1
game_port        = 33100
; 服务器显示名（登录器标题/状态栏）
server_name      = 归龙潮·复活服
; 请求超时（毫秒）
timeout_ms       = 8000
; 是否校验服务器响应签名（0=否，1=是；我们自己的服暂时为 0）
verify_sign      = 0

[Game]
; 归龙潮客户端可执行文件路径（留空则自动探测启动器所在目录及上级目录）
game_exe         = ..\..\..\GuiLongchao\game\GuiLongchao.exe
; 注入的 DLL 名称（必须与 OO_Launcher.exe 放在同一目录）
inject_dll       = OO_Internal.dll
; 传给游戏进程的命令行参数（留空则用默认）
game_args        = 
; 注入后是否等待游戏退出再关闭启动器（1=是）
keep_alive       = 1

[Account]
; 记住上次登录的账号（1=是，写入 launcher_state.ini）
remember         = 1
; 自动登录（1=是，下次启动直接登录）
auto_login       = 0

[Channel]
; 上报给客户端的渠道标识（对应游戏内 getTrackingInfo 的 channel_id）
channel_id       = internal_pc
platform         = windows

[Debug]
; 日志级别: error | warn | info | debug
log_level        = info
; 写日志文件
log_file         = 1
; 控制台（开发期用，发布版置 0）
console          = 0
