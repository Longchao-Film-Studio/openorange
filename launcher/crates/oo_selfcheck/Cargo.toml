[package]
name = "oo_selfcheck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "oo_selfcheck"
path = "src/main.rs"

[dependencies]
oo_shared = { workspace = true }
serde_json = { workspace = true }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
