# 项目级工具配置。
# mypy 配置放这里而不是 mypy.ini：mypy 读 .ini 用系统 locale（中文 Windows 是 GBK），
# 带中文注释的 ini 会直接 UnicodeDecodeError；tomllib 固定按 UTF-8 读。

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
# 旧代码（34k 行）整体补类型不现实：先保证「已注解部分正确」，
# 新模块用下面的 per-module override 提到严格模式；清单只增不减。
check_untyped_defs = false
exclude = "(?x)(^archive/|^Python/|^launcher/)"
# tests/ 和 tools/ 没有 __init__.py（namespace 包），不加这两行 mypy 会把同一文件
# 以两个模块名各查一遍（"Source file found twice"）。
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

# 严格清单：新增/重构的模块
[[tool.mypy.overrides]]
module = ["game_server.property.bag", "game_server.property.bag.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
